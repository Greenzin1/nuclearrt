name: Build Sonic XG Web

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  export:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 6 + 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            6.0.x
            9.0.x

      - name: Build CLI Exporter
        working-directory: cli
        run: dotnet publish -c Release

      - name: Download Sonic XG 2017
        run: |
          mkdir extracted
          curl -L -o "extracted\Sonic XG 2017.exe" "https://github.com/Greenzin1/nuclearrt/releases/download/sonic-xg-2017/Sonic_XG_2017.exe"

      - name: Clone CTFAK 2.0
        run: git clone --depth 1 https://github.com/CTFAK/CTFAK2.0.git ctfak

      - name: Patch CTFAK for CI
        shell: pwsh
        run: |
          $art = "ctfak/Interface/CTFAK.Cli/ASCIIArt.cs"
          (Get-Content $art -Raw) -replace 'Console\.WindowWidth', '80' -replace 'Console\.WindowHeight', '24' | Set-Content $art
          $prog = "ctfak/Interface/CTFAK.Cli/Program.cs"
          $progContent = Get-Content $prog -Raw
          $progContent = $progContent.Replace("Console.Clear();", "try { Console.Clear(); } catch { }")
          $progContent = $progContent.Replace("Console.ReadKey();", "// Console.ReadKey() - skipped for CI")
          $progContent | Set-Content $prog
          $img = "ctfak/Core/CTFAK.Core/CCN/Chunks/Banks/ImageBank/ImageBank.cs"
          $imgContent = Get-Content $img -Raw
          $imgContent = $imgContent.Replace("newImg.Read(reader);", 'try { newImg.Read(reader); } catch { }')
          $imgContent = $imgContent.Replace("foreach (var task in imageReadingTasks) task.Wait();", "foreach (var task in imageReadingTasks) { try { task.Wait(); } catch { } }")
          $imgContent | Set-Content $img
          $agi = "ctfak/Core/CTFAK.Core/MFA/AGMIBank.cs"
          $agiContent = Get-Content $agi -Raw
          $agiContent = $agiContent.Replace("foreach (var task in _imageWriteTasks) task.Wait();", 'foreach (var task in _imageWriteTasks) { try { task.Wait(); } catch { } }')
          $agiContent | Set-Content $agi

      - name: Build CTFAK 2.0
        run: dotnet publish ctfak/Interface/CTFAK.Cli/CTFAK.Cli.csproj -c Release

      - name: Build CTFAK Plugins
        run: |
          dotnet publish ctfak/Plugins/CTFAK.Decompiler/CTFAK.Decompiler.csproj -c Release
          dotnet publish ctfak/Plugins/Dumper/Dumper.csproj -c Release

      - name: Setup CTFAK
        shell: pwsh
        run: |
          $cliDir = "ctfak/Interface/CTFAK.Cli/bin/Release/net6.0-windows/publish"
          New-Item -ItemType Directory -Force -Path "$cliDir/Plugins"
          Copy-Item "ctfak/Plugins/CTFAK.Decompiler/bin/Release/net6.0-windows/publish/CTFAK.Decompiler.dll" "$cliDir/Plugins/"
          Copy-Item "ctfak/Plugins/Dumper/bin/Release/net6.0-windows/publish/Dumper.dll" "$cliDir/Plugins/"
          curl -L -o req.zip "https://github.com/CTFAK/.github/raw/main/ctfakrequirements.zip"
          7z x req.zip -o"$cliDir"

      - name: Decompile exe to MFA
        shell: pwsh
        run: |
          $cliDir = "ctfak/Interface/CTFAK.Cli/bin/Release/net6.0-windows/publish"
          $exePath = (Resolve-Path "extracted\Sonic XG 2017.exe").Path
          & "$cliDir/CTFAK.Cli.exe" -path $exePath -tool "Export as MFA" -closeonfinish

      - name: Find MFA file
        id: find-mfa
        shell: pwsh
        run: |
          $mfa = Get-ChildItem -Recurse -Filter "*.mfa" | Select-Object -First 1
          if ($mfa) {
            echo "mfa_path=$($mfa.FullName)" >> $env:GITHUB_OUTPUT
            Write-Host "Found MFA: $($mfa.FullName)"
          } else {
            Write-Host "No MFA found. Listing files:"
            Get-ChildItem -Recurse -File | Select-Object FullName
            exit 1
          }

      - name: Export with NuclearRT
        shell: pwsh
        run: |
          $fontsDir = Join-Path $env:LOCALAPPDATA "Microsoft\Windows\Fonts"
          New-Item -ItemType Directory -Force -Path $fontsDir | Out-Null
          $exePath = (Resolve-Path "extracted\Sonic XG 2017.exe").Path
          $cliDir = "cli\bin\Release\net9.0-windows\publish"
          $ctfak2dll = "ctfak\Interface\CTFAK.Cli\bin\Release\net6.0-windows\publish\CTFAK.Core.dll"
          if (Test-Path $ctfak2dll) {
            Copy-Item $ctfak2dll "$cliDir\CTFAK.Core.dll" -Force
            Write-Host "Swapped CTFAK.Core.dll with CTFAK 2.0 version"
          }
          Copy-Item $exePath "input.exe" -Force
          & "$cliDir\cli.exe" SourceCode input.exe output

      - name: Ensure runtime templates in output
        shell: pwsh
        run: |
          # If Exporter failed, runtime include/source won't be in output
          # Copy them directly from the repo's runtime directory
          if (-not (Test-Path "output\include") -or -not (Get-ChildItem "output\include" -ErrorAction SilentlyContinue)) {
            Write-Host "output/include is empty, copying from runtime..."
            New-Item -ItemType Directory -Force -Path "output\include" | Out-Null
            Copy-Item -Recurse "runtime\include\*" "output\include\"
          }
          if (-not (Test-Path "output\source") -or -not (Get-ChildItem "output\source" -ErrorAction SilentlyContinue)) {
            Write-Host "output/source is empty, copying from runtime..."
            New-Item -ItemType Directory -Force -Path "output\source" | Out-Null
            Copy-Item -Recurse "runtime\source\*" "output\source\"
          }
          if (-not (Test-Path "output\copy") -or -not (Get-ChildItem "output\copy" -Recurse -ErrorAction SilentlyContinue)) {
            Write-Host "output/copy is empty, copying from runtime..."
            New-Item -ItemType Directory -Force -Path "output\copy" | Out-Null
            Copy-Item -Recurse "runtime\copy\*" "output\copy\"
          }
          Write-Host "Output dirs:"
          Get-ChildItem "output" -Directory | ForEach-Object { Write-Host "  $($_.Name) ($((Get-ChildItem $_.FullName -Recurse -File).Count) files)" }

      - name: Upload exported data
        uses: actions/upload-artifact@v4
        with:
          name: exported-data
          path: output/

  build-web:
    needs: export
    runs-on: ubuntu-latest
    steps:
      - name: Checkout runtime
        uses: actions/checkout@v4
        with:
          sparse-checkout: runtime
          sparse-checkout-cone-mode: false

      - name: Setup Emscripten
        uses: mymindstorm/setup-emsdk@v14

      - name: Setup Ninja
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build

      - name: Download exported data
        uses: actions/download-artifact@v4
        with:
          name: exported-data
          path: output/

      - name: Copy data into runtime
        run: |
          cp -r output/include/* runtime/include/
          cp -r output/source/* runtime/source/
          mkdir -p runtime/copy
          cp -r output/copy/* runtime/copy/
          find runtime/source -name "*.template.*" -delete
          find runtime/include -name "*.template.*" -delete

      - name: Fix generated C++ placeholders
        run: |
          python3 -c "
          import glob, re, os

          # Fix CValue.h - add float overloads to fix CValue + float ambiguity
          cv = 'runtime/include/CValue.h'
          with open(cv) as f: c = f.read()
          if 'StaticInt' not in c:
              c = c.replace(
                  '    void ConvertToString()',
                  '    static inline int StaticInt(const CValue& v) { return v.GetIntValue(); }\n    static inline double StaticDouble(const CValue& v) { return v.GetDoubleValue(); }\n    static inline float StaticFloat(const CValue& v) { return (float)v.GetIntValue(); }\n    void ConvertToString()')
              print('Fixed CValue.h - added static helpers')
          # Add operator+(float) and operator-(float) to resolve CValue + float ambiguity
          if 'operator+(float' not in c:
              c = c.replace(
                  '    CValue& operator+(double other)',
                  '    CValue& operator+(float other) { return *this + (double)other; }\n    CValue& operator+(double other)')
          if 'operator-(float' not in c:
              c = c.replace(
                  '    CValue& operator-(double other)',
                  '    CValue& operator-(float other) { return *this - (double)other; }\n    CValue& operator-(double other)')
          if 'operator&(const CValue' not in c:
              c = c.replace(
                  'private:',
                  '    explicit operator bool() const { return GetIntValue() != 0; }\n\nprivate:')
          with open(cv, 'w') as f: f.write(c)
          print('Fixed CValue.h - added float overloads + operator int')

          # Add non-member operators to CValue.h for generated code
          # CValue has member operator+/-/*/%(CValue&) etc. that mutate *this and return CValue&
          # Non-member versions needed for const CValue& LHS (from std::min/max etc.)
          bitops = '\n// Non-member operators for generated code compatibility\n'
          bitops += 'inline CValue operator+(const CValue& a, const CValue& b) { CValue r(a); r = r + b; return r; }\n'
          bitops += 'inline CValue operator-(const CValue& a, const CValue& b) { CValue r(a); r = r - b; return r; }\n'
          bitops += 'inline CValue operator*(const CValue& a, const CValue& b) { CValue r(a); r = r * b; return r; }\n'
          bitops += 'inline CValue operator/(const CValue& a, const CValue& b) { CValue r(a); r = r / b; return r; }\n'
          bitops += 'inline CValue operator%(const CValue& a, const CValue& b) { CValue r(a); r = r % b; return r; }\n'
          bitops += 'inline CValue operator+(const CValue& a, int b) { CValue r(a); r = r + b; return r; }\n'
          bitops += 'inline CValue operator-(const CValue& a, int b) { CValue r(a); r = r - b; return r; }\n'
          bitops += 'inline CValue operator*(const CValue& a, int b) { CValue r(a); r = r * b; return r; }\n'
          bitops += 'inline CValue operator+(const CValue& a, double b) { CValue r(a); r = r + b; return r; }\n'
          bitops += 'inline CValue operator-(const CValue& a, double b) { CValue r(a); r = r - b; return r; }\n'
          bitops += 'inline CValue operator*(const CValue& a, double b) { CValue r(a); r = r * b; return r; }\n'
          bitops += 'inline CValue operator&(const CValue& a, const CValue& b) { return CValue(a.GetIntValue() & b.GetIntValue()); }\n'
          bitops += 'inline CValue operator&(const CValue& a, int b) { return CValue(a.GetIntValue() & b); }\n'
          bitops += 'inline CValue operator&(int a, const CValue& b) { return CValue(a & b.GetIntValue()); }\n'
          bitops += 'inline CValue operator|(const CValue& a, const CValue& b) { return CValue(a.GetIntValue() | b.GetIntValue()); }\n'
          bitops += 'inline CValue operator|(const CValue& a, int b) { return CValue(a.GetIntValue() | b); }\n'
          bitops += 'inline CValue operator|(int a, const CValue& b) { return CValue(a | b.GetIntValue()); }\n'
          bitops += 'inline CValue operator^(const CValue& a, const CValue& b) { return CValue(a.GetIntValue() ^ b.GetIntValue()); }\n'
          bitops += 'inline CValue operator^(const CValue& a, int b) { return CValue(a.GetIntValue() ^ b); }\n'
          bitops += 'inline CValue operator^(int a, const CValue& b) { return CValue(a ^ b.GetIntValue()); }\n'
          bitops += 'inline CValue operator~(const CValue& a) { return CValue(~a.GetIntValue()); }\n'
          bitops += 'inline bool operator!(const CValue& a) { return !a.GetIntValue(); }\n'
          if 'operator&(const CValue' not in c:
              with open(cv, 'a') as f: f.write(bitops)
              print('Fixed CValue.h - added non-member operators')

          # Fix AudioBackend.h - return 0 in CValue-returning functions -> return CValue(0)
          # And add CValue overloads for functions expecting int/float args
          ab = 'runtime/include/AudioBackend.h'
          with open(ab) as f: a = f.read()
          a = a.replace('{return 0;}', '{return CValue(0);}')
          cvalue_overloads = '\n// CValue overloads for generated code compatibility\n'
          cvalue_overloads += 'void SetSampleFreq(CValue freq, CValue id, CValue channel) { SetSampleFreq(freq.GetIntValue(), id.GetIntValue(), channel.GetIntValue() != 0); }\n'
          cvalue_overloads += 'void SetSamplePos(CValue pos, CValue id, CValue channel) { SetSamplePos(pos.GetIntValue(), id.GetIntValue(), channel.GetIntValue() != 0); }\n'
          cvalue_overloads += 'void SetSampleVolume(CValue volume, CValue id, CValue channel) { SetSampleVolume((float)volume.GetDoubleValue(), id.GetIntValue(), channel.GetIntValue() != 0); }\n'
          cvalue_overloads += 'void SetSamplePan(CValue pan, CValue id, CValue channel) { SetSamplePan((float)pan.GetDoubleValue(), id.GetIntValue(), channel.GetIntValue() != 0); }\n'
          if 'CValue overloads' not in a:
              a = a.replace('};', cvalue_overloads + '};')
          with open(ab, 'w') as f: f.write(a)
          print('Fixed AudioBackend.h - CValue overloads + returns')

          # Fix Animations.h - add CValue overload for SetCurrentSequenceIndex
          ah = 'runtime/include/Animations.h'
          with open(ah) as f: a = f.read()
          if 'SetCurrentSequenceIndex(const CValue' not in a:
              a = a.replace(
                  'void SetCurrentSequenceIndex(int index);',
                  'void SetCurrentSequenceIndex(int index);\n        void SetCurrentSequenceIndex(const CValue& index) { SetCurrentSequenceIndex(index.GetIntValue()); }')
              with open(ah, 'w') as f: f.write(a)
              print('Fixed Animations.h - added CValue overload')

          # Fix MathHelper.h - add missing CValue overloads
          mh = 'runtime/include/MathHelper.h'
          with open(mh) as f: c = f.read()
          if 'Cos(const CValue' not in c:
              c = c.replace(
                  'inline CValue Sin(const CValue& v) { return CValue(Sin(v.GetDoubleValue())); }',
                  'inline CValue Sin(const CValue& v) { return CValue(Sin(v.GetDoubleValue())); }\n    inline CValue Cos(const CValue& v) { return CValue(Cos(v.GetDoubleValue())); }\n    inline CValue Tan(const CValue& v) { return CValue(Tan(v.GetDoubleValue())); }\n    inline CValue ASin(const CValue& v) { return CValue(ASin(v.GetDoubleValue())); }\n    inline CValue ACos(const CValue& v) { return CValue(ACos(v.GetDoubleValue())); }\n    inline CValue ATan(const CValue& v) { return CValue(ATan(v.GetDoubleValue())); }\n    inline CValue ceil(const CValue& v) { return CValue(std::ceil(v.GetDoubleValue())); }\n    inline CValue floor(const CValue& v) { return CValue(std::floor(v.GetDoubleValue())); }\n    inline CValue round(const CValue& v) { return CValue(std::round(v.GetDoubleValue())); }\n    inline double trunc(const CValue& v) { return std::trunc(v.GetDoubleValue()); }\n    inline double fmod(const CValue& a, const CValue& b) { return std::fmod(a.GetDoubleValue(), b.GetDoubleValue()); }')
              with open(mh, 'w') as f: f.write(c)
              print('Fixed MathHelper.h - added CValue overloads')

          # Fix GeneratedFrame*.cpp and Generated*.h placeholders
          for f in glob.glob('runtime/source/Generated*.cpp') + glob.glob('runtime/include/Generated*.h'):
              with open(f) as fh: c = fh.read()
              c = re.sub(r'/\* Expression not found:.*?\*/', 'CValue(0)', c)
              c = re.sub(r'/\* Condition not found:.*?\*/', 'true', c)
              c = re.sub(r'/\* Action not found:.*?\*/', '// action not found', c)
              c = c.replace('std::ceil(', 'MathHelper::ceil(')
              c = c.replace('std::floor(', 'MathHelper::floor(')
              c = c.replace('std::round(', 'MathHelper::round(')
              c = c.replace('std::trunc(', 'MathHelper::trunc(')
              # Fix Group__ (empty group index) -> Group_0_
              c = re.sub(r'Group__(?=[A-Z])', 'Group_0_', c)
              # Fix int var = CValue(0) -> int var = 0
              c = re.sub(r'(\bint\s+\w+\s*=\s*)CValue\(0\)', r'\g<1>0', c)
              # Fix broken CValue chains from failed expression conversion
              # 2+ consecutive CValue(...) calls with optional trailing )
              c = re.sub(r'(?:CValue\([^)]*\)){2,}\)?', 'CValue(0)', c)
              # Any remaining )CValue( -> , CValue(
              c = c.replace(')CValue(', ', CValue(')
              with open(f, 'w') as fh: fh.write(c)
              print('Fixed ' + f)
          for f in glob.glob('runtime/include/ObjectFactory.h'):
              with open(f) as fh: c = fh.read()
              c = re.sub(r'/\* Expression not found:.*?\*/', 'CValue(0)', c)
              c = re.sub(r'/\* Condition not found:.*?\*/', 'true', c)
              c = re.sub(r'/\* Action not found:.*?\*/', '// action not found', c)
              c = c.replace('std::ceil(', 'MathHelper::ceil(')
              c = c.replace('std::floor(', 'MathHelper::floor(')
              c = c.replace('std::round(', 'MathHelper::round(')
              c = c.replace('std::trunc(', 'MathHelper::trunc(')
              with open(f, 'w') as fh: fh.write(c)
              print('Fixed ' + f)

          # Fix undeclared selectors in Generated*.h files
          # For each .h, find selectors used in corresponding .cpp that aren't declared
          # Use extern declarations in .h files, actual definitions in ObjectFactory.h
          all_used_selectors = set()
          for cppf in glob.glob('runtime/source/Generated*.cpp'):
              with open(cppf) as fh: cpp = fh.read()
              all_used_selectors.update(re.findall(r'(Group_\d+_Sprite_\d+_selector)', cpp))

          already_declared = set()
          for hfile in glob.glob('runtime/include/Generated*.h'):
              with open(hfile) as fh: h = fh.read()
              already_declared.update(re.findall(r'(?:ObjectSelector|extern ObjectSelector)\s+(Group_\d+_Sprite_\d+_selector)', h))

          missing_all = all_used_selectors - already_declared

          if missing_all:
              for cppf in glob.glob('runtime/source/Generated*.cpp'):
                  basename = os.path.basename(re.sub(r'\.cpp$', '', cppf))
                  hfile = 'runtime/include/' + basename + '.h'
                  if not os.path.exists(hfile): continue
                  with open(cppf) as fh: cpp = fh.read()
                  used = set(re.findall(r'(Group_\d+_Sprite_\d+_selector)', cpp))
                  with open(hfile) as fh: h = fh.read()
                  locally_declared = set(re.findall(r'(?:ObjectSelector|extern ObjectSelector)\s+(Group_\d+_Sprite_\d+_selector)', h))
                  locally_missing = used - locally_declared
                  if locally_missing:
                      decls = 'class ObjectSelector;\n' + ''.join('extern ObjectSelector ' + s + ';\n' for s in sorted(locally_missing))
                      h = h.replace('#pragma once', '#pragma once\n' + decls)
                      with open(hfile, 'w') as fh: fh.write(h)
                      print('Added ' + str(len(locally_missing)) + ' extern selector declarations to ' + hfile)

              # Add actual definitions to ObjectFactory.h
              # Put them at end of file (after includes) so ObjectSelector type is complete
              ofh = 'runtime/include/ObjectFactory.h'
              if os.path.exists(ofh):
                  with open(ofh) as fh: of = fh.read()
                  defs = '\n// Selector definitions\n' + ''.join('ObjectSelector ' + s + ';\n' for s in sorted(missing_all))
                  of = of.rstrip() + '\n' + defs
                  with open(ofh, 'w') as fh: fh.write(of)
                  print('Added ' + str(len(missing_all)) + ' selector definitions to ObjectFactory.h')

          "

      - name: Patch for Emscripten
        run: |
          python3 -c "
          p = 'runtime/source/SDL2PlatformBackend.cpp'
          with open(p) as f: c = f.read()
          c = c.replace('emscripten_console_log(text.c_str())', 'printf(\"%s\\\\n\", text.c_str())')
          with open(p,'w') as f: f.write(c)
          print('Patched SDL2PlatformBackend.cpp')
          "

      - name: Build Runtime for Web
        shell: pwsh
        run: |
          $link = "runtime/cmake/backend_sdl2_link.cmake"
          (Get-Content $link -Raw) -replace 'SDL2_ttf::SDL2_ttf', 'SDL2_ttf' | Set-Content $link
          embuilder build freetype
          mkdir -p build/web
          cd build/web
          emcmake cmake ../../runtime -DCMAKE_BUILD_TYPE=Release -DPLATFORM_BACKEND=SDL2 -DBUILD_SHARED_LIBS=OFF -DSDL_SHARED=OFF -DCMAKE_C_FLAGS="-sUSE_FREETYPE" -DCMAKE_CXX_FLAGS="-sUSE_FREETYPE -Wno-c++11-narrowing" -DCMAKE_EXE_LINKER_FLAGS="-sUSE_FREETYPE" -G Ninja
          cmake --build .

      - name: Package Web Build
        run: |
          mkdir -p web-build
          find build/web -name "*.js" -exec cp {} web-build/ \;
          find build/web -name "*.wasm" -exec cp {} web-build/ \;
          find build/web -name "*.data" -exec cp {} web-build/ \;

      - name: Upload web build
        uses: actions/upload-artifact@v4
        with:
          name: sonic-xg-web
          path: web-build/
